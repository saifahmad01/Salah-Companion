[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://salah-companion-z3i4.onrender.com/api"
  VITE_API_BASE_URL = "https://salah-companion-z3i4.onrender.com/api"
  VITE_BACKEND_URL = "https://salah-companion-z3i4.onrender.com"
  VITE_GOOGLE_CLIENT_ID = "520110657430-7cbd1c04pahgar6o59bp2s0lkub9b29q.apps.googleusercontent.com"

[[redirects]]
  from = "/*"
  to = "https://salah-companion.mdsaif.workers.dev/:splat"
  status = 301
  force = true

# Cache all static bundled assets on edge CDN for 1 year with immutable fingerprinting
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
